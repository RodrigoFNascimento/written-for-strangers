name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check existing issues first.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact requests you sent, e.g. a `curl` command.
      placeholder: |
        1. POST /links with {"url": "..."}
        2. GET /<code>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Status code, response body, logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.1.0 or a commit SHA
